name: Sentinel-2 true colour

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        type: string
      end_date:
        description: "End date (YYYY-MM-DD, inclusive)"
        required: true
        type: string
      source:
        description: "Satellite: sentinel-2 (10 m), landsat (30 m), sentinel-1 (radar; always series, ignores cloud settings) or all (runs the three side by side)"
        default: sentinel-2
        type: choice
        options:
          - sentinel-2
          - landsat
          - sentinel-1
          - all
      bbox:
        description: "min_lon,min_lat,max_lon,max_lat"
        default: "114,-2,115,-1"
        type: string
      max_cloud:
        description: "Scene-level eo:cloud_cover pre-filter (%)"
        default: "60"
        type: string
      accept_cloud:
        description: "Max SCL cloud (%) inside the bbox for a date to be acceptable"
        default: "20"
        type: string
      max_px:
        description: "Longest side of the output image (px)"
        default: "2500"
        type: string
      composite:
        description: "Image type: truecolour, swir (burn scars, sees through thin smoke) or both"
        default: truecolour
        type: choice
        options:
          - truecolour
          - swir
          - both
      tc_style:
        description: "True colour tone: soft (clouds keep detail) or esa (original, clouds clip to white)"
        default: soft
        type: choice
        options:
          - soft
          - esa
      series:
        description: "Publish a frame for EVERY date with full coverage (fills the timeline); ignores accept_cloud"
        default: false
        type: boolean
      label:
        description: "Optional area name shown on the site (blank = the bbox)"
        default: ""
        type: string
      publish:
        description: "Add this run to the viewer site (branch s2-output)"
        default: true
        type: boolean

permissions:
  contents: write  # publish step pushes the s2-output branch

jobs:
  truecolour:
    # source "all" fans out into one parallel job per satellite; one finding nothing never stops the others.
    name: ${{ matrix.source }}
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(inputs.source == 'all' && '["sentinel-2","landsat","sentinel-1"]' || format('["{0}"]', inputs.source)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pystac-client rasterio numpy matplotlib pillow planetary-computer

      - name: Make true-colour image
        env:
          SOURCE: ${{ matrix.source }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          BBOX: ${{ inputs.bbox }}
          MAX_CLOUD: ${{ inputs.max_cloud }}
          ACCEPT_CLOUD: ${{ inputs.accept_cloud }}
          MAX_PX: ${{ inputs.max_px }}
          COMPOSITE: ${{ inputs.composite }}
          LABEL: ${{ inputs.label }}
          TC_STYLE: ${{ inputs.tc_style }}
          SERIES: ${{ inputs.series }}
        run: |
          args=(
            --source "$SOURCE"
            --start-date "$START_DATE"
            --end-date "$END_DATE"
            --bbox "$BBOX"
            --max-cloud "$MAX_CLOUD"
            --accept-cloud "$ACCEPT_CLOUD"
            --max-px "$MAX_PX"
            --composite "$COMPOSITE"
            --tc-style "$TC_STYLE"
            --label "$LABEL"
            --outdir output
          )
          if [ "$SERIES" = "true" ]; then args+=(--series); fi
          # exit code 3 = valid request but no usable data for this satellite (no pass, nothing covers the box):
          # finish green with a warning so one empty satellite does not make a multi-satellite run look broken
          rc=0
          python scripts/s2_truecolour.py "${args[@]}" || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::warning::No usable ${SOURCE} data for this box and period (reason in the job summary)."
            exit 0
          fi
          exit "$rc"

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-truecolour-${{ matrix.source }}
          path: output/
          retention-days: 30
          if-no-files-found: warn

  publish:
    needs: truecolour
    # publish whatever the satellites produced, even if one of them hit a real error
    if: always() && inputs.publish && needs.truecolour.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One publisher at a time so two runs never overwrite each other's site update.
    # Only this short job is serialised; image building runs in parallel.
    concurrency:
      group: s2-output
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: s2-truecolour-*
          path: output

      - name: Publish to the viewer site
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT_BRANCH: s2-output
        run: |
          # one sub-folder per satellite (output/s2-truecolour-<source>/)
          shopt -s nullglob
          dirs=(output/*/)
          if [ "${#dirs[@]}" -eq 0 ]; then echo "::warning::Nothing to publish (no satellite produced output)."; exit 0; fi
          bash scripts/publish_site.sh "${dirs[@]}"
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          echo "**Viewer:** https://${owner}.github.io/${repo}/ (needs GitHub Pages enabled on branch \`s2-output\`; allow a minute or two to update)" >> "$GITHUB_STEP_SUMMARY"
